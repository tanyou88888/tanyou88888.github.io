<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0f">

    <title>tanyou8888 · Jailbreak</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: white;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    #30265c,
                    #171526 35%,
                    #08090d 70%
                );

            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 80px 20px 40px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            font-size: 40px;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #7567ff,
                #4235b8
            );

            box-shadow:
                0 15px 45px rgba(0,0,0,.45);
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .subtitle {
            margin-top: 12px;
            color: #a6a8b5;
            line-height: 1.6;
        }

        .buttons {
            margin: 35px auto 0;
            max-width: 420px;
        }

        .button {
            display: block;

            margin-bottom: 12px;

            padding: 16px 20px;

            border-radius: 15px;

            text-decoration: none;

            color: white;

            font-weight: bold;
            font-size: 16px;
        }

        .sileo {
            background: linear-gradient(
                135deg,
                #7567ff,
                #5648db
            );

            box-shadow:
                0 12px 30px
                rgba(100,85,240,.35);
        }

        .source {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
        }

        .card {
            margin-top: 35px;
            padding: 22px;

            text-align: left;

            border-radius: 20px;

            background: rgba(18,18,25,.8);

            border: 1px solid
                rgba(255,255,255,.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #9fa2b0;
            line-height: 1.7;
        }

        .url {
            display: block;

            padding: 12px;

            border-radius: 10px;

            background: #08080c;

            color: #c7c3ff;

            font-family: monospace;

            font-size: 13px;

            word-break: break-all;
        }

        footer {
            margin-top: 35px;
            color: #686b78;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        T
    </div>

    <h1>
        tanyou8888
    </h1>

    <div class="subtitle">
        Jailbreak Repository
        <br>
        iOS Tweaks · Tools · Utilities
    </div>

    <div class="buttons">

        <!-- 添加到 Sileo -->
        <a
            class="button sileo"
            href="sileo://source/https://tanyou88888.github.io/sileo/"
        >
            添加到 Sileo
        </a>

        <!-- 查看源 -->
        <a
            class="button source"
            href="/sileo/"
        >
            查看越狱源
        </a>

    </div>

    <div class="card">

        <h2>
            Repository
        </h2>

        <p>
            我的 iOS 越狱软件源。
            支持 Sileo、Zebra 等软件包管理器。
        </p>

        <span class="url">
            https://tanyou88888.github.io/sileo/
        </span>

    </div>

    <div class="card">

        <h2>
            如何添加
        </h2>

        <p>
            使用越狱设备的 Safari 打开本页面，
            点击「添加到 Sileo」即可尝试添加软件源。
            如果没有自动打开 Sileo，
            也可以复制上面的源地址手动添加。
        </p>

    </div>

    <footer>
        © 2026 tanyou8888
    </footer>

</div>

</body>
</html>
