name: Update APT Repository

on:
  push:
    paths:
      - "sileo/debs/**/*.deb"
      - "sileo/debs/*.deb"
      - "sileo/debs/rootless/**"
      - "sileo/debs/roothide/**"
      - "sileo/depictions/**"
      - "sileo/scripts/**"
      - "sileo/icons/**"
      - "sileo/banners/**"
      - "sileo/Release"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Generate Packages with all versions
        run: |
          cd sileo

          rm -f Packages Packages.gz

          dpkg-scanpackages \
            --multiversion \
            debs \
            /dev/null \
            > Packages

      - name: Enrich index (Icon / SileoDepiction / Changelog / Release checksums)
        run: |
          cd sileo
          python3 scripts/enrich-index.py

      - name: Build homepage
        run: |
          cd sileo
          python3 scripts/build-homepage.py

      - name: Show package index
        run: |
          echo "===== Package index ====="
          grep -E '^(Package|Version|Architecture|Filename):' sileo/Packages || true

      - name: Commit updated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sileo/Packages sileo/Packages.gz sileo/Release sileo/depictions sileo/scripts index.html

          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "Update APT package index"
            git push
          fi
