name: Pull JBOpenReborn release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release deb
        env:
          JB_TOKEN: ${{ secrets.JBOPENREBORN_TOKEN }}
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $JB_TOKEN" "https://api.github.com/repos/hejunjiea/JBOpenReborn/releases/latest")
          # 私有仓库资产必须走 API 端点 + octet-stream，browser_download_url 会 404
          API=$(echo "$REL" | python3 -c "import json,sys; r=json.load(sys.stdin); a=[x for x in r.get('assets',[]) if x['name'].endswith('.deb')]; print(a[0]['url'] if a else '')")
          NAME=$(echo "$REL" | python3 -c "import json,sys; r=json.load(sys.stdin); a=[x for x in r.get('assets',[]) if x['name'].endswith('.deb')]; print(a[0]['name'] if a else 'package.deb')")
          if [ -z "$API" ]; then
            echo "::error::最新 Release 没有 .deb 资产"
            exit 1
          fi
          echo "拉取: $NAME"
          mkdir -p sileo/debs/rootless
          curl -sL -H "Authorization: Bearer $JB_TOKEN" -H "Accept: application/octet-stream" -o "sileo/debs/rootless/$NAME" "$API"
          # 校验下载的是 ar 格式的 deb，而不是错误页
          if ! head -c 8 "sileo/debs/rootless/$NAME" | grep -q "!<arch>"; then
            echo "::error::下载的内容不是有效 deb（token 权限或资产地址问题）"
            cat "sileo/debs/rootless/$NAME" | head -c 200
            rm -f "sileo/debs/rootless/$NAME"
            exit 1
          fi
          ls -la "sileo/debs/rootless/$NAME"

      - name: Commit if new
        run: |
          git config user.name "release-puller"
          git config user.email "actions@users.noreply.github.com"
          git add sileo/debs/
          if git diff --cached --quiet; then
            echo "没有新版本"
            exit 0
          fi
          git commit -m "拉取 JBOpenReborn 最新正式版 deb"
          git push
