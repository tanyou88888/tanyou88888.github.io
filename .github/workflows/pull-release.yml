name: Pull upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: repo-write   # 两条流水线互斥：都是全量重建，取消旧例无损失
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev jq

      # 上游清单：sileo/meta/upstreams.json（加上游只加一条配置，无需改本文件）
      # 字段：repo=仓库 / private=是否需 JB_TOKEN / asset_suffix=资产名后缀
      #       dest=rootless|roothide 目录 / package=包 ID（记 meta 日期用）
      - name: Sync all upstreams
        env:
          JB_TOKEN: ${{ secrets.JBOPENREBORN_TOKEN }}
        run: |
          set -e
          mkdir -p sileo/debs/rootless sileo/debs/roothide sileo/meta
          for row in $(jq -c '.upstreams[]' sileo/meta/upstreams.json); do
            REPO=$(echo "$row" | jq -r '.repo')
            PRIVATE=$(echo "$row" | jq -r '.private')
            SUFFIX=$(echo "$row" | jq -r '.asset_suffix')
            DEST=$(echo "$row" | jq -r '.dest')
            PKG=$(echo "$row" | jq -r '.package')
            AUTH=()
            if [ "$PRIVATE" = "true" ]; then
              AUTH=(-H "Authorization: Bearer $JB_TOKEN")
            fi
            REL=$(curl -s "${AUTH[@]}" "https://api.github.com/repos/$REPO/releases/latest")
            API=$(echo "$REL" | jq -r --arg s "$SUFFIX" '[.assets[] | select(.name | endswith($s))][0].url // empty')
            NAME=$(echo "$REL" | jq -r --arg s "$SUFFIX" '[.assets[] | select(.name | endswith($s))][0].name // empty')
            DATE=$(echo "$REL" | jq -r '.published_at // ""' | cut -c1-10)
            if [ -z "$API" ]; then
              echo "::warning::$REPO 无后缀为 $SUFFIX 的资产，跳过"
              continue
            fi
            echo "同步 $REPO: $NAME ($DATE) → $DEST"
            # 私有仓库资产必须走 API 端点 + octet-stream（browser_download_url 404）
            ACCEPT="Accept: application/octet-stream"
            curl -sL "${AUTH[@]}" -H "$ACCEPT" -o "sileo/debs/$DEST/$NAME" "$API"
            if ! head -c 8 "sileo/debs/$DEST/$NAME" | grep -q "!<arch>"; then
              echo "::error::$REPO 下载内容不是有效 deb"
              head -c 200 "sileo/debs/$DEST/$NAME" || true
              rm -f "sileo/debs/$DEST/$NAME"
              exit 1
            fi
            VER=$(echo "${NAME%.deb}" | cut -d_ -f2)
            python3 -c "import json,sys,os; p='sileo/meta/release-dates.json'; m=json.load(open(p)) if os.path.exists(p) else {}; m.setdefault(sys.argv[1],{})[sys.argv[2]]=sys.argv[3]; json.dump(m,open(p,'w'),ensure_ascii=False,indent=2)" "$PKG" "$VER" "$DATE"
            BODY=$(echo "$REL" | jq -r '.body // ""')
            PKGARG="$PKG" VER="$VER" NOTE="$BODY" python3 -c "import json,os,re; pkg,ver,body=os.environ['PKGARG'],os.environ['VER'],os.environ.get('NOTE',''); bullets=[]; [bullets.append(re.sub(r'^[\-*+]\s*','',t).strip()) for t in body.splitlines() if t.strip() and not t.strip().startswith(('http','![')) and not t.strip().startswith('#') and len(bullets)<8]; p='sileo/meta/release-notes.json'; m=json.load(open(p)) if os.path.exists(p) else {}; m.setdefault(pkg,{}).setdefault(ver,{'title':ver,'bullets':bullets}); json.dump(m,open(p,'w'),ensure_ascii=False,indent=2)"
          done

      - name: Rebuild index (scan + enrich + homepage)
        run: |
          set -e
          cd sileo
          rm -f Packages Packages.gz
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          python3 scripts/enrich-index.py
          python3 scripts/build-homepage.py

      - name: Commit if new
        run: |
          git config user.name "release-puller"
          git config user.email "actions@users.noreply.github.com"
          git add sileo/debs/ sileo/meta/ sileo/Packages sileo/Packages.gz sileo/Release sileo/depictions sileo/scripts index.html
          if git diff --cached --quiet; then
            echo "没有新版本"
            echo "RESULT=无新版本" >> $GITHUB_ENV
            exit 0
          fi
          git commit -m "同步上游 Release 并重建索引"
          git push
          echo "RESULT=已上架" >> $GITHUB_ENV

      - name: Notify (Bark / Telegram，可选)
        if: always()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE="上游拉取流水线"
          if [ "${{ job.status }}" = "success" ]; then
            BODY="✅ ${RESULT:-成功}"
          else
            BODY="❌ 失败，请到 Actions 查看日志"
          fi
          if [ -n "$BARK_URL" ]; then
            curl -s -o /dev/null "$BARK_URL/$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")/$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[2]))" "$BODY")" || true
          fi
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="$TG_CHAT" -d text="${TITLE} ${BODY}" || true
          fi
          if [ -z "$BARK_URL" ] && { [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; }; then
            echo "未配置通知渠道（BARK_URL 或 TELEGRAM_BOT_TOKEN+TELEGRAM_CHAT_ID secret），跳过"
          fi
