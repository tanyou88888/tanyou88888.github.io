name: Pull JBOpenReborn release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release deb
        env:
          JB_TOKEN: ${{ secrets.JBOPENREBORN_TOKEN }}
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $JB_TOKEN" "https://api.github.com/repos/hejunjiea/JBOpenReborn/releases/latest")
          API=$(echo "$REL" | grep -o '"browser_download_url": *"[^"]*\.deb"' | head -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          if [ -z "$API" ]; then
            echo "::error::最新 Release 没有 .deb 资产"
            exit 1
          fi
          NAME=$(basename "$API")
          echo "拉取: $NAME"
          mkdir -p sileo/debs/rootless
          curl -sL -H "Authorization: Bearer $JB_TOKEN" -o "sileo/debs/rootless/$NAME" "$API"
          ls -la "sileo/debs/rootless/$NAME"

      - name: Commit if new
        run: |
          git config user.name "release-puller"
          git config user.email "actions@users.noreply.github.com"
          git add sileo/debs/
          if git diff --cached --quiet; then
            echo "没有新版本"
            exit 0
          fi
          git commit -m "拉取 JBOpenReborn 最新正式版 deb"
          git push
